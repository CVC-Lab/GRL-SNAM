[project]
name = "grl-snam"
version = "0.2.1"
description = "GRL-SNAM: Geometric Reinforcement Learning for Simultaneous Navigation and Mapping"
authors = [{ name = "GRL-SNAM authors" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.14"
keywords = ["reinforcement-learning", "navigation", "robotics", "hamiltonian", "geometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "torch>=2.1",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "imageio>=2.31",
]

[project.urls]
Homepage = "https://github.com/CVC-Lab/GRL-SNAM"
Repository = "https://github.com/CVC-Lab/GRL-SNAM"
"Bug Tracker" = "https://github.com/CVC-Lab/GRL-SNAM/issues"

[project.scripts]
# The unified command-line interface — one entry point for every workflow
# (selftest / obstacles / build-sdf / train / capture / pipeline / demo / eval).
grl-snam = "grl_snam.cli:main"
# Back-compat aliases (also reachable as `grl-snam selftest` / `grl-snam lab-demo`):
grl-snam-selftest = "grl_snam.selftest:main"
grl-snam-lab-demo = "grl_snam.demos.lab:main"

[tool.poetry]
packages = [
    { include = "grl_snam" },
    { include = "scripts" },
    { include = "experiments" },
    { include = "src" },
    # The research core (sdf_nav / material_nav / train_coef_energy / eval_coef_energy /
    # surrogate_robust) now lives UNDER grl_snam/ and is imported as grl_snam.<module>, so it
    # ships with the package — no more top-level module includes (they were a flat-layout legacy).
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=4.1"
ruff = ">=0.4"
black = ">=24.0"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Lint the whole grl_snam package + tests. The research core moved in from the repo
# root (sdf_nav / material_nav / train_coef_energy / eval_coef_energy /
# surrogate_robust) is now under grl_snam/ and held to the package lint standard
# (black + ruff), like the rest of it. experiments/ and scripts/ stay unlinted.
include = ["grl_snam/**/*.py", "tests/**/*.py"]
extend-exclude = ["build", "dist", "__pycache__", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "E741",  # ambiguous variable names tolerated in math-heavy research code
    "UP031", # printf-style %-format is idiomatic in the ported research/print code
]

# -----------------------------------------------------------------------------
# Coverage — the `grl_snam` library gate, enforced in CI at COVERAGE_MIN (the
# Python analog of libcvc's coverage gate). Scope mirrors the lint boundary
# (the maintained `grl_snam` package only). Omitted below is code with no
# headless-CI surface — runnable GL/matplotlib demos, video-capture /
# benchmark / one-off visualization scripts — plus trivial stubs and the thin
# CLI entry point. The research core (grl_snam/sdf_nav.py, material_nav.py,
# ...) is now under `grl_snam` but explicitly OMITted below to keep it outside this
# gate, as it was pre-refactor when it lived at the top level. `pytest --cov`
# and CI's `coverage run` both read this config, so the local and gated numbers
# match. Current: ~85% of the in-scope surface (gate floor is 80).
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["grl_snam"]
omit = [
    "grl_snam/demos/*",               # runnable GL / matplotlib demos
    "grl_snam/tools/capture.py",      # video capture (renders frames)
    "grl_snam/tools/*_capture.py",    # fog_ / squad_ / finale_ capture
    "grl_snam/tools/*_bench.py",      # timing benchmarks
    "grl_snam/tools/material_demo.py",
    "grl_snam/tools/wall_vis.py",     # one-off visualizations
    "grl_snam/tools/obstacles.py",
    "grl_snam/tools/sdf.py",
    "grl_snam/tools/pipeline.py",
    "grl_snam/tools/train.py",
    "grl_snam/tools/convoy_record.py",
    "grl_snam/tools/pursuit_record.py",
    "grl_snam/tools/squad_record.py",
    "grl_snam/cli.py",                # thin click entry point
    "grl_snam/selftest.py",           # smoke-test entry (imports + runs a demo)
    "grl_snam/adaptation.py",         # stub
    "grl_snam/network.py",            # stub
    "grl_snam/utils/*",               # stub
    # The research core, moved under grl_snam/ (was top-level, outside this gate). Kept OUT of the
    # coverage gate to preserve the pre-refactor scope — these are large torch research modules
    # exercised by the parity/native tests, not unit-covered line-by-line.
    "grl_snam/sdf_nav.py",
    "grl_snam/material_nav.py",
    "grl_snam/train_coef_energy.py",
    "grl_snam/eval_coef_energy.py",
    "grl_snam/surrogate_robust.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
exclude_also = [
    "def __del__",                    # best-effort finalizers
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
