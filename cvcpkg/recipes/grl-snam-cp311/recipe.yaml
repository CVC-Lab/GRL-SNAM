schema_version: 1

recipe:
  name: grl-snam-cp311
  upstream_version: "0.2.0"
  # cvc_revision 1 of the per-interpreter columns, which supersede the published
  # bare `grl-snam` package (that recipe targeted python311 only).
  # Bumped 1 -> 2: complete the declared PyPI closure — click (the
  # `grl-snam` CLI imports it at startup; every console script died
  # without it), plus matplotlib + imageio, whose cvcpkg columns now
  # exist (libcvc-deps), closing the "pending cvcpkg recipes" note
  # this recipe shipped with.
  # Bumped 2 -> 3: the v0.1.0 release asset was rebuilt from the current tree
  # and the tag moved with it, so the pinned sha256 changed. This is also the
  # first revision whose sdist declares [project.scripts] -- the published
  # 0.1.0+cvc.1 shipped the importable package with NO `grl-snam` console
  # script at all, which is why every "run it yourself" instruction that ended
  # at `cvcpkg install` could not actually work.
  # Bumped 3 -> 4: source.type python_sdist (pinned to the v0.1.0 release
  # asset + sha256) -> vendored, matching libcvc's own recipes. The pin froze
  # this column at the released tree; `cvcpkg build` could never build a local
  # checkout, and every source change required re-cutting the release asset.
  # Reset 4 -> 1 for the 0.2.0 upstream version: cvc_revision counts
  # revisions OF an upstream version, so a version bump restarts it.
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/CVC-Lab/GRL-SNAM
  license: MIT
  tags: [scientific, python, wheel, reinforcement-learning]
  description: >-
    GRL-SNAM — Geometric Reinforcement Learning for Simultaneous Navigation
    and Mapping — for CPython 3.11: the cp311 column of the per-interpreter
    recipe matrix.  A pure-Python (torch-based) research library packaged from
    its PEP 621 sdist and installed into this column's interpreter's own
    site-packages, so one activatable cvcpkg prefix carries libcvc's pycvc
    bindings and the importable `grl_snam` API side by side.

source:
  # Co-located with the GRL-SNAM source tree — the same pattern libcvc's own
  # recipes use (cvcpkg/recipes/pycvc-cp31X, cvc-cli, …).  `../../..` is the
  # repo root, so `cvcpkg build grl-snam-cp31X` builds THIS checkout.
  #
  # This replaces a `python_sdist` pin on the v0.1.0 GitHub release asset.
  # That pin made the recipe permanently describe 0.1.0 no matter what the
  # tree contained: every source change needed an sdist rebuild, a re-uploaded
  # release asset, a moved tag, a new sha256 and a cvc_revision bump — and in
  # between, `cvcpkg build` silently built the released code rather than the
  # working tree.  Vendored source removes that whole loop; the version now
  # comes from pyproject.toml, which is the single place it is declared.
  type: vendored
  path: ../../..

python:
  # grl-snam ships pure Python (py3-none-any), but like the rest of the cvcpkg
  # wheel matrix each column pins its own interpreter + ABI tag and installs
  # only into that interpreter's site-packages (the old single abi3 recipe is
  # what these columns supersede).  `build_isolation: false` builds the wheel
  # against the prefix using the pinned poetry-core backend (build_requires)
  # instead of a pip-downloaded copy — the hermeticity payoff.  No cp313t
  # column: pycvc-gl has none (SWIG is not free-threaded-safe).
  interpreter: python311
  abi: cp311
  build_isolation: false
  build_requires:
    - "poetry-core>=1.8,<3"

patches: []

depends:
  build:
    - name: python311
    # The PEP-517 backend (poetry.core.masonry.api): build.sh pip-installs the
    # sdist with --no-build-isolation --no-index, so the backend must already
    # be importable in the build prefix — this column edge stages it there
    # (libcvc-deps recipes/poetry-core-cp311, satisfying python.build_requires).
    - name: poetry-core-cp311
    # Test/lint tools for the `test:` block below. cvcpkg has no separate
    # test-deps group, so they are depends.build edges: staged into the build
    # prefix and stripped from the shipped bundle (never a runtime dependency
    # of grl-snam). Every cvcpkg python package is a per-interpreter column;
    # pin the columns matching this recipe's interpreter so pytest imports the
    # same interpreter's site-packages the grl-snam closure installs into.
    # ruff is a plain binary tool (no interpreter column).
    - name: pytest-cp311
    - name: ruff
    - name: black-cp311
  runtime:
    - name: python311
    # The lab imports pycvc + pycvc_gl (the scriptable scene). Those bindings
    # are no longer bundled in libcvc (libcvc is a pure C++ SDK now); they ship
    # as the per-interpreter pycvc-gl columns, which pull in libcvc + numpy
    # transitively.
    - name: pycvc-gl-cp311
    - name: numpy-cp311
    # The surrogate-dynamics numerics + the grl-snam-selftest correctness demo
    # need torch (CPU). The visual lab path (pycvc-gl) does not.
    - name: torch-cp311
    # The `grl-snam` CLI (and every console-script alias) is Click-based
    # and imports click at startup — pyproject declares it; the recipe
    # previously omitted it, so the installed entry points could not
    # even --help.
    - name: click-cp311
    # The demo/capture path (grl_snam.demos, pipeline video capture)
    # renders through matplotlib and writes frames through imageio;
    # their cvcpkg columns exist now, completing the declared closure.
    - name: matplotlib-cp311
    - name: imageio-cp311

build:
  # Pure Python: built once, valid everywhere (platform: any / noarch).
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

# Bundle self-test — the cvcpkg-native counterpart to the GRL-SNAM CI test job.
# Runs `pytest -q` under the build prefix (where depends.build staged pytest/
# ruff/black and depends.runtime staged the pycvc-gl + numpy + torch closure)
# against the just-built package. A non-zero exit means the bundle is broken and
# must not ship. The FULL lint+test suite over the working tree runs in CI
# (.github/workflows/ci.yml), which installs this same closure via cvcpkg —
# once per interpreter column.
test:
  script: test.sh

package:
  files:
    - lib/python3.11/site-packages/grl_snam/
    - lib/python3.11/site-packages/grl_snam_lab/
    - lib/python3.11/site-packages/grl_snam-0.2.0.dist-info/
    - lib/python3.11/site-packages/scripts/
    - lib/python3.11/site-packages/experiments/
    - lib/python3.11/site-packages/src/
    - lib/python3.11/site-packages/train_coef_energy.py
    - lib/python3.11/site-packages/eval_coef_energy.py
    - lib/python3.11/site-packages/surrogate_robust.py

notes: >-
  Provenance & follow-ups.  (1) Source is the GRL-SNAM checkout this recipe
  ships in (`source.type: vendored`, `path: ../../..`), the same arrangement
  libcvc uses for pycvc-cp31X / cvc-cli — so the column tracks the tree and
  needs no release asset, no mirrored sdist and no sha256 to re-pin.
  `upstream_version` and the `package.files` dist-info path below both carry
  the pyproject version; move all three together when it bumps.  (2) This is the cp311 column of the grl-snam per-interpreter
  matrix (grl-snam-cp311/cp312/cp313); the three columns supersede the
  published bare `grl-snam` recipe.  No cp313t column while pycvc-gl (SWIG)
  has none.  (3) Runtime PyPI deps: the full declared closure — click, numpy,
  torch, matplotlib, imageio — is covered by cvcpkg columns; nothing
  is pending.  (4) build_isolation:false
  needs the pinned poetry-core backend importable in the build interpreter;
  the depends.build edge on poetry-core-cp311 (libcvc-deps) satisfies it.
