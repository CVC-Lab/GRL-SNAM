schema_version: 1

recipe:
  name: grl-snam-learning-checkpoints
  upstream_version: "1.0.0"
  # BUMP cvc_revision on ANY change to the staged bytes (SHA256SUMS, PROVENANCE.md or a
  # checkpoint): a same-revision re-push silently no-ops against the published artifact.
  # 1: retrain/ and fixed/retrain/ (410). 2: world-units/retrain/ added (615).
  cvc_revision: 2
  kind: data
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  homepage: https://github.com/CVC-Lab/GRL-SNAM
  license: MIT
  tags: [data, grl-snam, checkpoints, nav, learning]
  description: >-
    The learning check's saved policies (docs/learning-validation.md in GRL-SNAM): every
    checkpoint of its three five-seed SDF retrains, 41 a seed (steps 0 to 4000), as torch
    checkpoints (coef_sdf.step*.pt for grl_snam / sdf_nav.CoefMLP). retrain/ is §2.3's run,
    fixed/retrain/ §8.3's (after the C2 fix), world-units/retrain/ §9.4's (the sim in world
    units, an objective that is the task). Each is the file the committed learning history
    names as its blob, byte for byte (SHA256SUMS). grl-snam ariadne scrub deploys them; the
    GRL-SNAM Pages site's scrub page is built from them. Installs to
    share/grl-snam-learning-checkpoints/.

source:
  # Data-only, and the checkpoints are not in the repository (.gitignore keeps *.pt out): build.sh
  # stages them from GRL_SNAM_LEARNING_RUNS at pack time and checks every one against the
  # SHA256SUMS committed here, so the package's bytes are pinned by the repository.
  type: none

build:
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - share/grl-snam-learning-checkpoints/
