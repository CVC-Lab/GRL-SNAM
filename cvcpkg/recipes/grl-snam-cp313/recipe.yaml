schema_version: 1

recipe:
  name: grl-snam-cp313
  upstream_version: "0.1.0"
  # cvc_revision 1 of the per-interpreter columns, which supersede the published
  # bare `grl-snam` package (that recipe targeted python311 only).
  cvc_revision: 1
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://github.com/CVC-Lab/GRL-SNAM
  license: MIT
  tags: [scientific, python, wheel, reinforcement-learning]
  description: >-
    GRL-SNAM — Geometric Reinforcement Learning for Simultaneous Navigation
    and Mapping — for CPython 3.13: the cp313 column of the per-interpreter
    recipe matrix.  A pure-Python (torch-based) research library packaged from
    its PEP 621 sdist and installed into this column's interpreter's own
    site-packages, so one activatable cvcpkg prefix carries libcvc's pycvc
    bindings and the importable `grl_snam` API side by side.

source:
  # Pure-Python noarch sdist: a single artifact valid on every platform (and
  # identical across the cp311/cp312/cp313 columns), so there is no
  # per-platform `artifacts` map — cvcpkg falls back to this top-level
  # url/sha256 (the documented pure-Python case).  cvcpkg fetches the tarball
  # and verifies the sha256 before build.sh runs; the install is then offline.
  type: python_sdist
  url: https://github.com/CVC-Lab/GRL-SNAM/releases/download/v0.1.0/grl_snam-0.1.0.tar.gz
  sha256: "208f21688e5634de128b5ab4ec77e9563e903a62888ecda81e2afa384bd01cd2"
  strip_components: 1

python:
  # grl-snam ships pure Python (py3-none-any), but like the rest of the cvcpkg
  # wheel matrix each column pins its own interpreter + ABI tag and installs
  # only into that interpreter's site-packages (the old single abi3 recipe is
  # what these columns supersede).  `build_isolation: false` builds the wheel
  # against the prefix using the pinned poetry-core backend (build_requires)
  # instead of a pip-downloaded copy — the hermeticity payoff.  No cp313t
  # column: pycvc-gl has none (SWIG is not free-threaded-safe).
  interpreter: python313
  abi: cp313
  build_isolation: false
  build_requires:
    - "poetry-core>=1.8,<3"

patches: []

depends:
  build:
    - name: python313
    # Test/lint tools for the `test:` block below. cvcpkg has no separate
    # test-deps group, so they are depends.build edges: staged into the build
    # prefix and stripped from the shipped bundle (never a runtime dependency
    # of grl-snam). Every cvcpkg python package is a per-interpreter column;
    # pin the columns matching this recipe's interpreter so pytest imports the
    # same interpreter's site-packages the grl-snam closure installs into.
    # ruff is a plain binary tool (no interpreter column).
    - name: pytest-cp313
    - name: ruff
    - name: black-cp313
  runtime:
    - name: python313
    # The lab imports pycvc + pycvc_gl (the scriptable scene). Those bindings
    # are no longer bundled in libcvc (libcvc is a pure C++ SDK now); they ship
    # as the per-interpreter pycvc-gl columns, which pull in libcvc + numpy
    # transitively.
    - name: pycvc-gl-cp313
    - name: numpy-cp313
    # The surrogate-dynamics numerics + the grl-snam-selftest correctness demo
    # need torch (CPU). The visual lab path (pycvc-gl) does not.
    - name: torch-cp313
    # NOTE: the full research core (train/eval, grl_snam.*) also imports
    # matplotlib + imageio — pending cvcpkg recipes; the two demos (viz +
    # selftest) do not need them, so they are omitted until those land.

build:
  # Pure Python: built once, valid everywhere (platform: any / noarch).
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

# Bundle self-test — the cvcpkg-native counterpart to the GRL-SNAM CI test job.
# Runs `pytest -q` under the build prefix (where depends.build staged pytest/
# ruff/black and depends.runtime staged the pycvc-gl + numpy + torch closure)
# against the just-built package. A non-zero exit means the bundle is broken and
# must not ship. The FULL lint+test suite over the working tree runs in CI
# (.github/workflows/ci.yml), which installs this same closure via cvcpkg —
# once per interpreter column.
test:
  script: test.sh

package:
  files:
    - lib/python3.13/site-packages/grl_snam/
    - lib/python3.13/site-packages/grl_snam-0.1.0.dist-info/
    - lib/python3.13/site-packages/scripts/
    - lib/python3.13/site-packages/experiments/
    - lib/python3.13/site-packages/src/
    - lib/python3.13/site-packages/train_coef_energy.py
    - lib/python3.13/site-packages/eval_coef_energy.py
    - lib/python3.13/site-packages/surrogate_robust.py

notes: >-
  Provenance & follow-ups.  (1) The sdist is the artifact built from
  CVC-Lab/GRL-SNAM (`grl_snam-0.1.0.tar.gz`); the pinned sha256 is that
  file's hash.  The url points at the v0.1.0 GitHub release asset — publish
  that release (or mirror the sdist to a cvcpkg source host) so the fetch
  resolves.  (2) This is the cp313 column of the grl-snam per-interpreter
  matrix (grl-snam-cp311/cp312/cp313); the three columns supersede the
  published bare `grl-snam` recipe.  No cp313t column while pycvc-gl (SWIG)
  has none.  (3) Runtime PyPI deps: numpy/torch are covered by their cvcpkg
  columns; matplotlib (>=3.7) and imageio (>=2.31) still need python_wheel
  recipes before the full research core resolves.  (4) build_isolation:false
  needs the pinned poetry-core backend importable in the build interpreter —
  a poetry-core wheel recipe is the remaining prerequisite (else build with
  network isolation on).
