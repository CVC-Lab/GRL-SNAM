name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Line-coverage gate (percent) for the grl_snam library, enforced by the
# coverage step in the test job below — the Python analog of libcvc's
# COVERAGE_MIN gate. Scope + exclusions live in pyproject.toml [tool.coverage]:
# the maintained grl_snam package, minus demos / capture / benchmark scripts
# (no headless-CI surface) and the flat-layout research modules.
env:
  COVERAGE_MIN: '80'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One linux job per interpreter column: the grl-snam recipe matrix
      # (grl-snam-cp311/cp312/cp313) pins the matching pycvc-gl / numpy /
      # torch columns from the cvcpkg catalog, and each leg runs the suite
      # under that column's interpreter. No 313t leg: pycvc-gl has no cp313t
      # column (SWIG is not free-threaded-safe).
      matrix:
        py: ["311", "312", "313"]
    name: test (cp${{ matrix.py }})
    steps:
      - uses: actions/checkout@v5

      # Install grl-snam's whole dependency closure (build + runtime) from the
      # cvcpkg catalog into a prefix: python31X, pycvc-gl-cp31X (which pulls
      # pycvc + libcvc + cvcgl + vtk transitively), numpy-cp31X + torch-cp31X
      # (CPU), and the pytest-cp31X/ruff/black-cp31X test/lint tools (the
      # recipe's depends.build). This replaces the old `pip install`: pip
      # cannot install pycvc-gl (a cvcpkg package, not on PyPI), so
      # `from pycvc_gl... import *` used to ModuleNotFoundError in CI. The
      # column recipe is the single source of truth for the closure
      # (`install-deps <recipe>`), so there is no requirements file.
      - name: Install dependency closure via cvcpkg
        id: deps
        uses: transfix/libcvc-deps/.github/actions/cvcpkg-install@master
        with:
          recipe: cvcpkg/recipes/grl-snam-cp${{ matrix.py }}
          build_type: Release

      - name: Lint + test
        env:
          PREFIX: ${{ steps.deps.outputs.path }}
          PY_DIGITS: ${{ matrix.py }}
        run: |
          set -euo pipefail
          if [ -z "${PREFIX}" ]; then
            echo "::error::cvcpkg install-deps failed to resolve the grl-snam-cp${PY_DIGITS} closure."
            echo "::error::Is it published? Needs pycvc-gl-cp${PY_DIGITS}, numpy-cp${PY_DIGITS},"
            echo "::error::torch-cp${PY_DIGITS}, pytest-cp${PY_DIGITS}, black-cp${PY_DIGITS}"
            echo "::error::and ruff in the cvcpkg catalog."
            exit 1
          fi
          PYVER="${PY_DIGITS:0:1}.${PY_DIGITS:1}"   # 311 -> 3.11
          PY="${PREFIX}/bin/python${PYVER}"

          # Test THIS checkout's grl_snam / grl_snam_lab (the PR's code); the
          # compiled pycvc_gl + numpy + torch come from the cvcpkg prefix.
          export PYTHONPATH="${PWD}:${PYTHONPATH:-}"
          # The compiled bindings (_pycvc_gl / _pycvc) link libcvc.so.3, cvcGL,
          # VTK etc. from the prefix's lib/, and we run the prefix python without
          # sourcing its activate script, so put the prefix lib dir on the loader
          # path — otherwise `import pycvc_gl` fails with
          # "libcvc.so.3: cannot open shared object file".
          export LD_LIBRARY_PATH="${PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

          echo "== black --check =="
          "${PY}" -m black --check grl_snam tests
          echo "== ruff check =="
          # --exclude _libcvc-deps: the cvcpkg-install action checks the
          # libcvc-deps repo out into the workspace (for the cvcpkg source +
          # recipes); linting THIS repo must not sweep that checkout.
          "${PREFIX}/bin/ruff" check . --exclude _libcvc-deps
          # coverage.py is a dev-only measurement tool, not a runtime dep, so it
          # is not in the grl-snam cvcpkg closure. Install it into a throwaway
          # dir on PYTHONPATH (never the hermetic prefix) — the same way the
          # libcvc CI apt-installs its coverage tool (lcov) outside cvcpkg. If
          # the team later prefers the catalog, a coverage-cp3XX recipe
          # (libcvc-deps tools/gen_python_recipes.py SEED_PACKAGES, like
          # pytest-cp3XX) drops in via the recipe's depends.build instead.
          echo "== install coverage (dev tool, outside the cvcpkg closure) =="
          "${PY}" -m ensurepip --upgrade >/dev/null 2>&1 || true  # prefix python ships pip; guard anyway
          COVDIR="${RUNNER_TEMP}/covtools"
          "${PY}" -m pip install --quiet --disable-pip-version-check --target "${COVDIR}" 'coverage>=7.4'
          export PYTHONPATH="${COVDIR}:${PYTHONPATH}"

          echo "== pytest (under coverage) =="
          # Scope + omits are read from pyproject.toml [tool.coverage].
          "${PY}" -m coverage run -m pytest -q

          echo "== coverage gate (>= ${COVERAGE_MIN}%) =="
          "${PY}" -m coverage report | tee "${RUNNER_TEMP}/cov.txt"
          pct="$(awk '/^TOTAL/ { gsub(/%/,"",$NF); print $NF; exit }' "${RUNNER_TEMP}/cov.txt")"
          if [ -z "${pct}" ]; then
            echo "::error::Could not parse grl_snam coverage total from the report"; exit 1
          fi
          echo "grl_snam line coverage: ${pct}% (gate: >= ${COVERAGE_MIN}%)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if awk -v p="${pct}" -v min="${COVERAGE_MIN}" 'BEGIN { exit !(p+0 < min+0) }'; then
            echo "::error::grl_snam line coverage ${pct}% is below the required ${COVERAGE_MIN}%"
            exit 1
          fi
          echo "grl_snam line coverage ${pct}% meets the ${COVERAGE_MIN}% gate."
