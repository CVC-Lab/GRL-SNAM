name: pages

# GRL-SNAM's pages: a static landing page, and GRL-SNAM's Ariadne ports running in the browser on
# libcvc's ariglx-web (CPython 3.12, pycvc, pycvc_gl and numpy in WebAssembly). This workflow
# builds and checks them; it deploys nothing. The site is published from another repository's
# workflow, which checks out this repo and calls the same scripts (pages/README.md says how):
#
#   1. pages/build-ariglx-web.sh builds ariglx-web from the pinned libcvc tag (LIBCVC_REF), as
#      libcvc's own deploy-pages.yml builds its gallery: the recipe's script, the single-threaded
#      build (wasm), since GitHub Pages sends no COOP/COEP headers, in the lean tier (no
#      vtk-python). About 30 minutes, so it is cached by libcvc's commit and the script.
#   2. pages/assemble.py writes the site: the landing page (pages/site/), learn/, which runs
#      `grl-snam ariadne learn` on the learning check's retrain histories
#      (docs/learning-validation/retrain/), and scrub/, which runs `grl-snam ariadne scrub
#      --view` on the checkpoints of the learning check's three retrains (retrain,
#      fixed/retrain, world-units/retrain), deployed here, natively, on libcvc's generated world
#      (the page views runs; deploying a .pt checkpoint needs torch and libcvc's sim_world, so
#      a cvcpkg closure whose libcvc is LIBCVC_REF's; the checkpoints come from the cvcpkg data
#      package grl-snam-learning-checkpoints; the runs are cached by what they depend on); and,
#      with --scrub-austin, scrub-austin/ beside it: the same runs deployed in Austin, where the
#      policies were trained, the city (the cvcpkg package cy-pca/scene-austin-south-small, 10 MB)
#      fetched by the page from cvcpkg.org; and, with --coph, coph/live/ inside the CoPH poster:
#      `grl-snam ariadne coph` playing back a run file per demo (crossing, hazard), baked here
#      with torch from the vendored demos' episodes (cached by grl_snam/coph/). With --learn-only,
#      --scrub-only or --coph-only, one page alone, for another site. Everything a page fetches
#      is on the site's own origin, but Austin's city.
#   3. pages/smoke.mjs loads it in headless Chrome as Pages serves it: learn must start, run its
#      frames and make learn-report's claims in the page, and each scrub page must start, show a
#      checkpoint, draw the world its runs were deployed on and run its frames (scrub-austin/ may
#      reach cvcpkg.org, no other page any origin but its own), and the CoPH page must play each
#      demo's run file. It runs on the whole site under /GRL-SNAM/, and on the pages alone at
#      another path, as another site serves them.

on:
  pull_request:
    paths:
      - pages/**
      - grl_snam/**
      - docs/learning-validation/**
      - cvcpkg/recipes/grl-snam-learning-checkpoints/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - pages/**
      - grl_snam/**
      - docs/learning-validation/**
      - cvcpkg/recipes/grl-snam-learning-checkpoints/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The libcvc release the pages run on. ariglx-web is built from this tag (its recipe,
  # cvcpkg/recipes/ariglx-web, and the pycvc_gl.ariadne Host the ports adopt; it is not on
  # cvcpkg.org), and the scrub page's runs are deployed with the catalog's libcvc of the same
  # version: the page builds libcvc's generated world again with its own generator, so the two
  # must be one release. 4.0.0 has Ariadne's chart: widget (3.7.14+), so the pages draw charts.
  LIBCVC_REF: v4.0.0

jobs:
  build:
    name: build and check the pages
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check out libcvc at ${{ env.LIBCVC_REF }}
        uses: actions/checkout@v4
        with:
          repository: transfix/libcvc
          ref: ${{ env.LIBCVC_REF }}
          path: libcvc

      - name: libcvc's commit
        id: libcvc
        run: echo "sha=$(git -C libcvc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ariglx-web
        id: cache
        uses: actions/cache@v4
        with:
          path: ariglx-web
          key: ariglx-web-wasm-lean-${{ steps.libcvc.outputs.sha }}-${{ hashFiles('pages/build-ariglx-web.sh') }}

      - name: Build ariglx-web (wasm, lean) with its recipe's script
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash pages/build-ariglx-web.sh libcvc "$RUNNER_TEMP/ariglx-web-work" ariglx-web

      # The scrub page's runs: each retrain checkpoint deployed with `grl-snam ariadne scrub`,
      # which imports numpy, torch, pycvc and pycvc_gl (sim_world, the generator) and no more. The
      # libcvc family is pinned to LIBCVC_REF's version, the libcvc ariglx-web is built from; a
      # newer one in the catalog would generate the world the page does not draw (assemble.py's
      # --expect-libcvc and the smoke check both).
      - name: Install the deploy's closure via cvcpkg, libcvc pinned to LIBCVC_REF
        id: deps
        run: |
          set -euo pipefail
          command -v cvcpkg >/dev/null || {
            curl -fsSL https://cvcpkg.org/install.sh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          }
          v="${LIBCVC_REF#v}"
          prefix="$RUNNER_TEMP/closure"
          # pillow-cp312: the CoPH run files' nameplates (grl-snam ariadne coph --bake draws them).
          cvcpkg install python312 numpy-cp312 torch-cp312 pillow-cp312 "libcvc==$v" "cvcgl==$v" \
            "pycvc-cp312==$v" "pycvc-gl-cp312==$v" --platform linux --prefix "$prefix" \
            --config release --link shared --no-fallback-to-source
          # The Humvee's glTF the scrub page draws its cars with (assemble.py ships it from the
          # prefix, with its CC BY credit in the page's THIRD_PARTY_NOTICES.md).
          cvcpkg install vehicle-humvee --prefix "$prefix" --platform any --config release \
            --link shared --no-fallback-to-source
          ls "$prefix"/lib/libcvc.so.* | head -3
          echo "path=$prefix" >> "$GITHUB_OUTPUT"

      # v5: the lean run logs are packed (grl_snam.run_log/v2). A v4 cache's would still be read,
      # and packed when read, but the key moves with grl_snam/** anyway.
      - name: Cache the scrub pages' runs
        uses: actions/cache@v4
        with:
          path: scrub-runs
          key: scrub-runs-v5-${{ env.LIBCVC_REF }}-${{ hashFiles('grl_snam/**', 'docs/learning-validation/retrain/**', 'docs/learning-validation/fixed/retrain/**', 'docs/learning-validation/world-units/retrain/**', 'cvcpkg/recipes/grl-snam-learning-checkpoints/**') }}

      # The CoPH demos' episodes (two arms each, from the vendored runner: a crossing arm takes
      # about 20 minutes, a hazard arm about 6), which the CoPH page's run files are baked from on
      # every build. They depend on grl_snam/coph/'s code alone.
      - name: Cache the CoPH demos' episodes
        uses: actions/cache@v4
        with:
          path: coph-runs
          key: coph-runs-v1-${{ hashFiles('grl_snam/coph/**/*.py') }}

      - name: Assemble the site, and the learn, scrub and CoPH pages alone
        env:
          PREFIX: ${{ steps.deps.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$PREFIX" || { echo "::error::no deploy closure"; exit 1; }
          command -v cvcpkg >/dev/null || {
            curl -fsSL https://cvcpkg.org/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
          }
          # The learning check's saved policies are not in the repository: the cvcpkg data package
          # grl-snam-learning-checkpoints (cvcpkg/recipes/grl-snam-learning-checkpoints) has them,
          # each checked against the committed histories' blobs by sha256 when it was packed.
          cvcpkg install grl-snam-learning-checkpoints --prefix "$RUNNER_TEMP/checkpoints" \
            --platform any --config release --link shared --no-fallback-to-source
          # scrub/ on libcvc's generated city, and scrub-austin/ on Austin (its runs in
          # scrub-runs/austin/); coph/live/, its run files baked from coph-runs/.
          python3 pages/assemble.py --host ariglx-web/share/ariglx-web --out _site \
            --scrub --scrub-austin --python "$PREFIX/bin/python3.12" --scrub-cache scrub-runs \
            --checkpoints "$RUNNER_TEMP/checkpoints/share/grl-snam-learning-checkpoints" \
            --expect-libcvc "$LIBCVC_REF" --coph --coph-cache coph-runs
          python3 pages/assemble.py --host ariglx-web/share/ariglx-web --coph-only \
            --out _other_site/demos/coph/live \
            --coph-runs coph-runs/crossing.coph.npz coph-runs/hazard.coph.npz \
            --vehicle-model "$PREFIX/share/cvc-scenes/shared/Humvee.glb"
          python3 pages/assemble.py --host ariglx-web/share/ariglx-web --learn-only \
            --out _other_site/demos/learn
          python3 pages/assemble.py --host ariglx-web/share/ariglx-web --scrub-only \
            --out _other_site/demos/scrub \
            --scrub-reports scrub-runs/humvee/retrain/*.scrub.json \
              scrub-runs/humvee/fixed/retrain/*.scrub.json \
              scrub-runs/humvee/world-units/retrain/*.scrub.json \
              scrub-runs/kinematic/retrain/*.scrub.json \
              scrub-runs/kinematic/fixed/retrain/*.scrub.json \
              scrub-runs/kinematic/world-units/retrain/*.scrub.json --expect-libcvc "$LIBCVC_REF" \
            --vehicle-model "$PREFIX/share/cvc-scenes/shared/Humvee.glb"
          austin=()  # the Humvee's runs first, as the page opens on them
          for plant in humvee kinematic; do
            for set in retrain fixed/retrain world-units/retrain; do
              austin+=(scrub-runs/austin/"$plant"/"$set"/*.scrub.json)
            done
          done
          python3 pages/assemble.py --host ariglx-web/share/ariglx-web --scrub-only \
            --out _other_site/demos/scrub-austin --scrub-reports "${austin[@]}" \
            --expect-libcvc "$LIBCVC_REF" \
            --vehicle-model "$PREFIX/share/cvc-scenes/shared/Humvee.glb"

      - name: Load them in headless Chrome
        run: |
          command -v cvcpkg >/dev/null || {
            curl -fsSL https://cvcpkg.org/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
          }
          # Node 22 for the smoke's fetch and WebSocket, from the catalog.
          cvcpkg install nodejs22 --platform linux --prefix "$RUNNER_TEMP/node" \
            --config release --link shared --no-fallback-to-source
          node="$RUNNER_TEMP/node/bin/node"
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          "$chrome" --version
          "$node" pages/smoke.mjs --site _site --chrome "$chrome" --base /GRL-SNAM/ \
            --scrub scrub/ --city-scrub scrub-austin/ --coph coph/live/ --shots shots
          # The learn, scrub and CoPH pages alone, as another site serves them: under its own
          # path, no landing page.
          "$node" pages/smoke.mjs --site _other_site --chrome "$chrome" --base /other-site/ \
            --learn demos/learn/ --scrub demos/scrub/ --city-scrub demos/scrub-austin/ \
            --coph demos/coph/live/ --no-landing --shots shots/alone

      - name: Upload the smoke's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke-shots
          path: shots
          if-no-files-found: ignore
