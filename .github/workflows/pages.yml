name: pages

# GRL-SNAM's pages: a static landing page, and GRL-SNAM's Ariadne ports running in the browser on
# libcvc's ariglx-web (CPython 3.12, pycvc, pycvc_gl and numpy in WebAssembly). This workflow
# builds and checks them; it deploys nothing. The site is published from another repository's
# workflow, which checks out this repo and calls the same scripts (pages/README.md says how):
#
#   1. pages/build-ariglx-web.sh builds ariglx-web from the pinned libcvc tag (LIBCVC_REF), as
#      libcvc's own deploy-pages.yml builds its gallery: the recipe's script, the single-threaded
#      build (wasm), since GitHub Pages sends no COOP/COEP headers, in the lean tier (no
#      vtk-python). About 30 minutes, so it is cached by libcvc's commit and the script.
#   2. pages/assemble.py writes the site: the landing page (pages/site/) and learn/, which runs
#      `grl-snam ariadne learn` on the learning check's retrain histories
#      (docs/learning-validation/retrain/); with --learn-only, the learn page alone, for another
#      site. Everything a page fetches is on the site's own origin.
#   3. pages/smoke.mjs loads it in headless Chrome as Pages serves it: learn must start, run its
#      frames and make learn-report's claims in the page. It runs on the whole site under
#      /GRL-SNAM/, and on the learn page alone at another path, as another site serves it.

on:
  pull_request:
    paths:
      - pages/**
      - grl_snam/**
      - docs/learning-validation/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - pages/**
      - grl_snam/**
      - docs/learning-validation/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The libcvc tag ariglx-web is built from: its recipe (cvcpkg/recipes/ariglx-web) and the
  # pycvc_gl.ariadne Host the ports adopt. ariglx-web is not on cvcpkg.org, so it is built here.
  LIBCVC_REF: v3.7.13

jobs:
  build:
    name: build and check the pages
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check out libcvc at ${{ env.LIBCVC_REF }}
        uses: actions/checkout@v4
        with:
          repository: transfix/libcvc
          ref: ${{ env.LIBCVC_REF }}
          path: libcvc

      - name: libcvc's commit
        id: libcvc
        run: echo "sha=$(git -C libcvc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ariglx-web
        id: cache
        uses: actions/cache@v4
        with:
          path: ariglx-web
          key: ariglx-web-wasm-lean-${{ steps.libcvc.outputs.sha }}-${{ hashFiles('pages/build-ariglx-web.sh') }}

      - name: Build ariglx-web (wasm, lean) with its recipe's script
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash pages/build-ariglx-web.sh libcvc "$RUNNER_TEMP/ariglx-web-work" ariglx-web

      - name: Assemble the site, and the learn page alone
        run: |
          python3 pages/assemble.py --host ariglx-web/share/ariglx-web --out _site
          python3 pages/assemble.py --host ariglx-web/share/ariglx-web --learn-only \
            --out _other_site/demos/learn

      - name: Load them in headless Chrome
        run: |
          command -v cvcpkg >/dev/null || {
            curl -fsSL https://cvcpkg.org/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
          }
          # Node 22 for the smoke's fetch and WebSocket, from the catalog.
          cvcpkg install nodejs22 --platform linux --prefix "$RUNNER_TEMP/node" \
            --config release --link shared --no-fallback-to-source
          node="$RUNNER_TEMP/node/bin/node"
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          "$chrome" --version
          "$node" pages/smoke.mjs --site _site --chrome "$chrome" --base /GRL-SNAM/ --shots shots
          # The learn page alone, as another site serves it: under its own path, no landing page.
          "$node" pages/smoke.mjs --site _other_site --chrome "$chrome" --base /other-site/ \
            --learn demos/learn/ --no-landing --shots shots/learn-only

      - name: Upload the smoke's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke-shots
          path: shots
          if-no-files-found: ignore
